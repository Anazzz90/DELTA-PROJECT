# =============================================================================
# config/scoring_weights.yaml
# =============================================================================
# Configurable weights for the DMARS Scoring Engine.
#
# Adjust these values to tune how each dimension affects the final score.
# All weights should sum to 1.0 for a clean 0.0-1.0 final score.
#
# Dimensions:
#   fact_consistency   — Did the agent accurately use the facts given?
#   reasoning_depth    — Did the agent generate multiple hypotheses + weaknesses?
#   overconfidence_penalty — Is the agent confident despite shallow reasoning?
#
# =============================================================================

weights:
  fact_consistency:       0.40   # Most important: grounded in the actual facts
  reasoning_depth:        0.40   # Second: thorough, multi-hypothesis reasoning
  overconfidence_penalty: 0.20   # Penalty subtracted if confidence >> depth

# Depth scoring thresholds
# An agent needs at least this many items per field to get full depth credit.
depth_thresholds:
  min_possible_explanations: 2   # At least 2 possible explanations
  min_ranked_hypotheses:     2   # At least 2 ranked hypotheses
  min_acknowledged_weaknesses: 1 # At least 1 weakness (already enforced by schema)
  max_for_full_credit:       4   # 4+ items = full depth credit (capped)

# Overconfidence detection
# If an agent claims high confidence but has shallow reasoning, apply penalty.
overconfidence:
  confidence_threshold: 0.80     # Confidence above this triggers penalty check
  depth_threshold:      0.50     # Depth below this = agent is overconfident
  max_penalty:          0.20     # Maximum score deduction for overconfidence
