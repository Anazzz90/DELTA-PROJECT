[tool.poetry]
name = "dmars"
version = "0.1.0"
description = "Delta-First Multi-AI Reasoning System — A modular multi-agent AI reasoning system for high-stakes decision-making."
authors = ["DMARS Team"]
readme = "README.md"

# =============================================================================
# CHECKPOINT 1 — Core only (installs cleanly, no C++ compiler needed)
# Run: poetry install
# =============================================================================
[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
pyyaml = "^6.0"
jinja2 = "^3.1"
tenacity = "^8.0"
aiohttp = "^3.9"

# LiteLLM — LLM routing (needed from Checkpoint 4 onward)
litellm = "^1.40"

# =============================================================================
# CHECKPOINT 9 — Storage (SQLite + SQLAlchemy)
# Run: poetry install --with storage
# NOTE: chromadb requires Microsoft C++ Build Tools on Windows.
#       Install separately when needed: pip install chromadb
# =============================================================================
[tool.poetry.group.storage]
optional = true

[tool.poetry.group.storage.dependencies]
sqlalchemy = "^2.0"
aiosqlite = "^0.20"

# =============================================================================
# CHECKPOINT 10 — Dashboard (Streamlit)
# Run: poetry install --with dashboard
# =============================================================================
[tool.poetry.group.dashboard]
optional = true

[tool.poetry.group.dashboard.dependencies]
streamlit = "^1.35"

# =============================================================================
# CHECKPOINT 13+ — Phase 2 Backend (FastAPI, Redis, RQ)
# Run: poetry install --with phase2
# NOTE (Checkpoint 15): psycopg2-binary is sync-only and does NOT work with
#       SQLAlchemy's create_async_engine(). asyncpg needs a C++ compiler to
#       build from source on Windows and has no prebuilt wheel for newer
#       Python versions yet. psycopg[binary] (v3) supports async natively
#       and ships prebuilt wheels — no compiler needed.
# =============================================================================
[tool.poetry.group.phase2]
optional = true

[tool.poetry.group.phase2.dependencies]
fastapi = "^0.111"
uvicorn = {version = "^0.30", extras = ["standard"]}
redis = "^5.0"
rq = "^1.16"
alembic = "^1.13"
psycopg = {version = "^3.1", extras = ["binary", "pool"]}

# =============================================================================
# CHECKPOINT 17 — LangFuse Observability
# Run: poetry install --with observability
# NOTE: langfuse 2.x's generated API client uses pydantic's `v1` compat shim,
#       which crashes at import time on Python 3.14 ("unable to infer type
#       for attribute" ConfigError — a pydantic/Python 3.14 incompatibility,
#       not a DMARS bug). langfuse 4.x dropped that codegen path and imports
#       cleanly (tested directly against litellm's callback integration).
# =============================================================================
[tool.poetry.group.observability]
optional = true

[tool.poetry.group.observability.dependencies]
langfuse = "^4.0"

# =============================================================================
# Dev tools — always installed
# =============================================================================
[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (full pipeline end-to-end, concurrent queries)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
